server:
  port: 8080

spring:
  datasource:
    # 数据库连接信息支持环境变量覆盖（DB_HOST / DB_PORT / DB_NAME / DB_PASSWORD）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 🟢 必须加上这块配置，顶格写，不要缩进到 spring 下面
campus:
  # 文件上传目录，支持环境变量覆盖（Linux 部署建议 /data/campus-uploads/）
  upload-path: ${CAMPUS_UPLOAD_PATH:D:/campus-uploads/}